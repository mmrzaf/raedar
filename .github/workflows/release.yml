name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - id: meta
        shell: bash
        env:
          DISPATCHED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${DISPATCHED:-$GITHUB_REF_NAME}"
          version="$(cat VERSION)"
          case "$tag" in
            "v$version") prerelease=false ;;
            "v$version"-*) prerelease=true ;;
            *)
              echo "Tag $tag does not match VERSION $version" >&2
              exit 1
              ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}

  image:
    name: Publish the image
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: image
        shell: bash
        run: |
          set -euo pipefail
          name="$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "name=$name"
            echo "tags<<EOF"
            echo "$name:${{ needs.metadata.outputs.version }}"
            if [ "${{ needs.metadata.outputs.prerelease }}" = "false" ]; then
              echo "$name:${{ needs.metadata.outputs.minor }}"
              echo "$name:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=raedar
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}

  release:
    name: GitHub release
    needs: [metadata, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Raedar ${{ needs.metadata.outputs.version }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          body: |
            Raedar ${{ needs.metadata.outputs.version }}.

            Image: `${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.metadata.outputs.version }}`

            Configuration, labels and the webhook payload: no changes since the
            previous release (this is the first release).
