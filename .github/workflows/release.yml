name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - id: meta
        shell: bash
        env:
          REQUESTED: ${{ inputs.tag }}
          NAME: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-$GITHUB_REF_NAME}"
          version="$(cat VERSION)"
          case "$tag" in
            "v$version") prerelease=false ;;
            "v$version"-*) prerelease=true ;;
            *)
              echo "Tag $tag does not match VERSION $version" >&2
              exit 1
              ;;
          esac

          # The release body is the CHANGELOG section for this version, so the
          # notes cannot drift from the repository. Fail before publishing
          # anything if it is missing.
          notes="$(awk -v version="$version" '
            index($0, "## [" version "]") == 1 { section = 1; next }
            section && /^## / { exit }
            section {
              if (!started && $0 !~ /^[ \t]*$/) started = 1
              if (started) line[++count] = $0
            }
            END {
              while (count > 0 && line[count] ~ /^[ \t]*$/) count--
              for (i = 1; i <= count; i++) print line[i]
            }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]')"
            echo "prerelease=$prerelease"
            echo "notes<<RAEDAR_NOTES"
            echo "$notes"
            echo "RAEDAR_NOTES"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}

  image:
    name: Publish the image
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.metadata.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.metadata.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.metadata.outputs.tag }},enable=${{ needs.metadata.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=raedar
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}

  release:
    name: GitHub release
    needs: [metadata, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Compose the release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          NOTES: ${{ needs.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          {
            printf "Image: \`%s:%s\`\n\n" "$IMAGE" "$VERSION"
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Raedar ${{ needs.metadata.outputs.version }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/notes.md
