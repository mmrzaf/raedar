{{template "header" .}}
<h1>Patterns</h1>
<form class="filters" method="get">
  <label>Subject <select name="subject" data-autosubmit>{{range .Subjects}}<option value="{{.Value}}"{{if eq .Value $.Subject}} selected{{end}}>{{.Label}}</option>{{end}}</select></label>
  <label>Metric <select name="metric">{{range .Metrics}}<option value="{{.}}"{{if eq . $.Metric}} selected{{end}}>{{.}}</option>{{end}}</select></label>
  <label>Weeks <input type="number" name="weeks" min="1" max="52" value="{{.Weeks}}"></label>
  <button type="submit">Show</button>
</form>
<div class="patterns" data-series="{{.Series}}" data-weeks="{{.Weeks}}">
  <p class="patterns-error" hidden>The patterns could not be loaded. Check the database and try again.</p>
  <section><h2>Week heatmap</h2><div class="heatmap" aria-label="Average by weekday and hour"></div></section>
  <section><h2>Day profile</h2><div class="chart" data-chart="profile"></div></section>
  <section><h2>Trend</h2><div class="chart" data-chart="trend"></div></section>
</div>
{{template "footer" .}}
