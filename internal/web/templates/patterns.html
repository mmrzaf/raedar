{{template "header" .}}
<div class="page-head">
  <div>
    <h1>Patterns</h1>
    <p class="sub">When things tend to happen, in {{.Page.Location}} time</p>
  </div>
</div>
<form class="filters" method="get">
  <label>Subject <select name="subject" data-autosubmit>{{range .Subjects}}<option value="{{.Value}}"{{if eq .Value $.Subject}} selected{{end}}>{{.Label}}</option>{{end}}</select></label>
  <label>Metric <select name="metric" data-autosubmit>{{range .Metrics}}<option value="{{.}}"{{if eq . $.Metric}} selected{{end}}>{{.}}</option>{{end}}</select></label>
  <label>Weeks <input class="narrow" type="number" name="weeks" min="1" max="52" value="{{.Weeks}}"></label>
  <button class="primary" type="submit">Show</button>
</form>
<div class="patterns" data-series="{{.Series}}" data-weeks="{{.Weeks}}">
  <p class="patterns-error" hidden>The patterns could not be loaded. Check the database and try again.</p>
  <section class="section">
    <div class="section-head"><h2>Week heatmap</h2><span class="hint">average per weekday and hour</span></div>
    <div class="card">
      <div class="heatmap" aria-label="Average by weekday and hour"></div>
      <div class="legend-scale"><span class="legend-min"></span><span class="ramp"></span><span class="legend-max"></span></div>
    </div>
  </section>
  <div class="charts">
    <section class="card"><div class="card-head"><h2>Day profile</h2><span class="hint">average by hour of day</span></div><div class="chart" data-chart="profile"></div></section>
    <section class="card"><div class="card-head"><h2>Trend</h2><span class="hint">one value per day</span></div><div class="chart" data-chart="trend"></div></section>
  </div>
</div>
{{template "footer" .}}
